<linkset>
  <html:link rel="localization" href="notero.ftl" />
</linkset>

<!-- `Notero_Preferences` is defined in `src/content/prefs/preferences.tsx` -->
<groupbox class="notero-groupbox" onload="Notero_Preferences.init()">
  <label>
    <html:h2 data-l10n-id="notero-preferences-capacities-groupbox-heading" />
  </label>
  <hbox
    align="center"
    class="notero-margin-block-end"
    id="notero-capacitiesToken-container"
  >
    <label
      control="notero-capacitiesToken"
      data-l10n-id="notero-preferences-capacities-token-label"
    />
    <html:input
      data-l10n-id="notero-preferences-capacities-token-input"
      id="notero-capacitiesToken"
      type="password"
    />
    <button
      data-l10n-id="notero-preferences-capacities-connect-button"
      id="notero-capacitiesConnect"
    />
  </hbox>
  <image class="zotero-spinner-16" id="notero-capacitiesConnection-spinner" />
  <vbox align="start" hidden="true" id="notero-capacitiesConnection-container">
    <hbox align="center">
      <label
        data-l10n-id="notero-preferences-capacities-space"
        id="notero-capacitiesSpace"
      />
      <button
        data-l10n-id="notero-preferences-capacities-disconnect-button"
        id="notero-capacitiesDisconnect"
      />
    </hbox>
    <hbox align="center" class="notero-margin-block-start">
      <label
        control="notero-capacitiesStructure"
        data-l10n-id="notero-preferences-capacities-structure"
      />
      <menulist
        id="notero-capacitiesStructure"
        disabled="true"
        native="true"
        preference="extensions.notero.capacitiesStructureID"
      >
        <menupopup />
      </menulist>
    </hbox>
    <hbox align="center" class="notero-margin-block-start">
      <label
        control="notero-capacitiesCollection"
        data-l10n-id="notero-preferences-capacities-collection"
      />
      <menulist
        id="notero-capacitiesCollection"
        disabled="true"
        native="true"
        preference="extensions.notero.capacitiesCollectionID"
      >
        <menupopup />
      </menulist>
    </hbox>
  </vbox>
  <label class="notero-error" hidden="true" id="notero-capacitiesError" />
</groupbox>

<groupbox class="notero-groupbox">
  <label>
    <html:h2 data-l10n-id="notero-preferences-properties-groupbox-heading" />
  </label>
  <label data-l10n-id="notero-preferences-properties-groupbox-description" />
  <hbox align="center" class="notero-margin-block-start">
    <label
      control="notero-pageTitleFormat"
      data-l10n-id="notero-preferences-page-title-format"
    />
    <menulist
      id="notero-pageTitleFormat"
      disabled="true"
      native="true"
      preference="extensions.notero.pageTitleFormat"
    >
      <menupopup />
    </menulist>
  </hbox>
</groupbox>

<groupbox class="notero-groupbox">
  <label>
    <html:h2 data-l10n-id="notero-preferences-sync-groupbox-heading" />
  </label>
  <label data-l10n-id="notero-preferences-sync-groupbox-description1" />
  <label data-l10n-id="notero-preferences-sync-groupbox-description2" />
  <hbox
    class="notero-margin-block-start notero-margin-block-end virtualized-table-container"
    flex="1"
  >
    <html:div id="notero-syncConfigsTable-container" />
  </hbox>
  <checkbox
    data-l10n-id="notero-preferences-sync-on-modify-items"
    id="notero-syncOnModifyItems"
    native="true"
    preference="extensions.notero.syncOnModifyItems"
  />
  <checkbox
    data-l10n-id="notero-preferences-sync-notes"
    id="notero-syncNotes"
    native="true"
    preference="extensions.notero.syncNotes"
  />
</groupbox>
